name: RoomReady release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomready-candidate
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the RoomReady container
        run: docker build --file deployment/Dockerfile --tag roomready:test .

      - name: Test the built container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD/app/tests:/checks:ro" roomready:test python -m unittest discover -v -s /checks
          docker run --detach --name roomready-test --publish 127.0.0.1:8080:8080 --env RELEASE_ID="$GITHUB_SHA" roomready:test
          trap 'docker rm --force roomready-test > /dev/null' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --output "$RUNNER_TEMP/roomready-health.json" http://127.0.0.1:8080/health
          jq -e --arg release "$GITHUB_SHA" '.status == "ok" and .release == $release' "$RUNNER_TEMP/roomready-health.json"
          curl --fail --silent --show-error http://127.0.0.1:8080/ > "$RUNNER_TEMP/roomready-form.html"
          grep -q 'name="csrf_token"' "$RUNNER_TEMP/roomready-form.html"

      - name: Sign in to Google Cloud with the release identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.RELEASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish the tested image and capture its digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${IMAGE_BASE}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker tag roomready:test "$image_tag"
          docker push "$image_tag"
          digest=$(gcloud artifacts docker images describe "$image_tag" --project="$GCP_PROJECT_ID" --format='value(image_summary.digest)')
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${IMAGE_BASE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy a private candidate and verify its traffic
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          target=("$SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION")
          suffix="r${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          revision="${SERVICE}-${suffix}"
          before="$RUNNER_TEMP/roomready-before.json"
          after="$RUNNER_TEMP/roomready-after.json"
          gcloud run services describe "${target[@]}" --format='json(status.traffic)' > "$before"
          gcloud run services update "${target[@]}" --image="$IMAGE" --update-env-vars="RELEASE_ID=$GITHUB_SHA" \
            --revision-suffix="$suffix" --tag=candidate --no-traffic --quiet
          gcloud run services describe "${target[@]}" --format=json > "$after"
          jq -e --slurpfile previous "$before" --arg revision "$revision" --arg image "$IMAGE" '
            def serving: [.status.traffic[] | select(.percent > 0) | {revisionName, percent}] | sort_by(.revisionName);
            .status.latestReadyRevisionName == $revision and
            .spec.template.spec.containers[0].image == $image and
            any(.status.traffic[]; .tag == "candidate" and .revisionName == $revision and (.percent // 0) == 0) and
            (serving == ($previous[0] | serving))
          ' "$after"
          {
            printf 'Deployed `%s` at zero normal traffic.\n\n' "$revision"
            printf 'Source `%s`\n\nImage `%s`\n' "$GITHUB_SHA" "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
